<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F3EF">
<title>予定表</title>
<style>
/* 配色：和紙の白・墨・藍・朱。日めくりカレンダー（土は青、日は朱）の色づかいに合わせる */
:root {
  --paper: #F2F3EF; --panel: #FFFFFF; --ink: #1B1D22; --sub: #4B525C; --mute: #8A929C; --line: #D5D9D6;
  --accent: #1F3A66; --accent-ink: #FFFFFF; --accent-soft: #E3E9F4;
  --red: #C23B22; --blue: #2A5BA8; --ok: #2F7A4B;
  --z: 1;                          /* 文字の大きさ（予定とToDoの中身だけに効く） */
  --u: calc(1rem / var(--z));      /* 文字の大きさに左右されない 1rem（ボタン・日付・おしらせ用） */
  --ff: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
[data-theme="night"] {
  --paper: #0D1320; --panel: #161F31; --ink: #EEF2F8; --sub: #AAB6C8; --mute: #66748A; --line: #26334A;
  --accent: #9DBBF5; --accent-ink: #0B1630; --accent-soft: #1C2A45; --red: #FF8F73; --blue: #8DB4FF; --ok: #6FD39A;
}
* { box-sizing: border-box; }
html { font-size: calc(min(1.5vw, 2vh) * var(--z)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; height: 100dvh; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: var(--ff); font-weight: 500; line-height: 1.25;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }
svg { display: block; }

/* ---- 全体：横向きは左に日付、右に大きなボタンと本文。縦向きは上に日付、下にボタン ---- */
.app {
  height: 100dvh; padding: calc(var(--u) * 1.6) calc(var(--u) * 2) calc(var(--u) * 1.6) calc(var(--u) * 1.6);
  display: grid; gap: calc(var(--u) * 1.2) calc(var(--u) * 2.4);
  grid-template-columns: min(calc(var(--u) * 19), 29vw) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "cal tabs" "cal view";
}
.viewwrap { grid-area: view; position: relative; min-height: 0; }
.view { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 1rem; }
.view::-webkit-scrollbar { display: none; }

/* ---- 左：日めくり ---- */
.cal { grid-area: cal; display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); min-height: 0; overflow: hidden; padding-bottom: calc(var(--u) * .6); }
.daycard {
  position: relative; background: var(--panel); border-radius: calc(var(--u) * .9); text-align: center;
  padding: calc(var(--u) * 3.1) calc(var(--u) * .8) calc(var(--u) * 1.4);
  box-shadow: 0 calc(var(--u) * .5) 0 calc(var(--u) * -.12) var(--line), 0 0 0 calc(var(--u) * .12) var(--line);
}
.daycard .bind { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 2.1); background: var(--accent); border-radius: calc(var(--u) * .9) calc(var(--u) * .9) 0 0; }
.daycard .bind::before, .daycard .bind::after { content: ""; position: absolute; top: 50%; width: calc(var(--u) * .9); height: calc(var(--u) * .9); margin-top: calc(var(--u) * -.45); border-radius: 50%; background: var(--paper); }
.daycard .bind::before { left: 20%; } .daycard .bind::after { right: 20%; }
.daycard .mo { font-size: calc(var(--u) * 2.6); font-weight: 800; color: var(--sub); }
.daycard .dd { font-family: var(--serif); font-size: calc(var(--u) * 10.5); font-weight: 900; line-height: 1.02; font-variant-numeric: tabular-nums; }
.daycard .dsuf { display: none; }
.daycard .wk { font-size: calc(var(--u) * 3); font-weight: 800; }
.daycard.sun .dd, .daycard.sun .wk { color: var(--red); }
.daycard.sat .dd, .daycard.sat .wk { color: var(--blue); }
.clock { font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: baseline; justify-content: center; gap: calc(var(--u) * .6); }
.clock .ap { font-size: calc(var(--u) * 1.9); font-weight: 700; color: var(--sub); }
.clock .hm { font-size: calc(var(--u) * 4.8); font-weight: 800; }
.greet { font-size: calc(var(--u) * 2); font-weight: 700; color: var(--sub); text-align: center; }
.napchip { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * .7); min-height: calc(var(--u) * 5.2); border-radius: 99rem; background: var(--accent); color: var(--accent-ink); font-size: calc(var(--u) * 1.9); font-weight: 800; white-space: nowrap; padding: 0 calc(var(--u) * 1.2); }
.napchip[hidden] { display: none; }
.napchip svg { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); }
.tools { margin-top: auto; display: flex; gap: calc(var(--u) * .7); }
.tool { flex: 1; min-width: 0; min-height: calc(var(--u) * 5.6); border-radius: calc(var(--u) * 1); border: calc(var(--u) * .14) solid var(--line); background: var(--panel); text-align: center; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; }
.tool .k { font-size: calc(var(--u) * 1.4); color: var(--sub); font-weight: 700; }
.tool .v { font-size: calc(var(--u) * 2); font-weight: 800; white-space: nowrap; }
.tool.warn { border-color: var(--red); background: var(--red); color: #fff; }
.tool.warn .k { color: #fff; }
.tool:active { transform: scale(.97); }

/* ---- 上：大きなボタン ---- */
.tabs { grid-area: tabs; display: flex; gap: calc(var(--u) * .9); }
.tab {
  flex: 1; min-width: 0; position: relative; min-height: calc(var(--u) * 7.6); border-radius: calc(var(--u) * 1.2);
  background: var(--panel); border: calc(var(--u) * .16) solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .35);
  font-size: calc(var(--u) * 1.8); font-weight: 800; white-space: nowrap;
}
.tab svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab:active { transform: scale(.97); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.badge { position: absolute; top: calc(var(--u) * -.7); right: calc(var(--u) * -.4); min-width: calc(var(--u) * 3); padding: .1rem calc(var(--u) * .8); border-radius: 99rem; background: var(--red); color: #fff; font-size: calc(var(--u) * 1.8); font-weight: 800; text-align: center; line-height: 1.5; }
[data-theme="night"] .badge { color: #2a0a03; }

/* ---- きょうの主役 ---- */
.hero {
  display: flex; flex-direction: column; gap: .5rem; width: 100%; text-align: left;
  background: var(--accent); color: var(--accent-ink); border-radius: 1.2rem; padding: calc(var(--u) * 1.3) calc(var(--u) * 1.9) calc(var(--u) * 1.4); margin-bottom: 1.3rem;
  position: sticky; top: 0; z-index: 2; box-shadow: 0 1.3rem 0 0 var(--paper), 0 2.4rem 0 -.2rem var(--paper);   /* 一覧が動いても主役は上に残す */
}
.tail { height: 60dvh; pointer-events: none; }   /* 予定が少ない日も、いまの予定を上まで寄せられるようにする余白（高さは autoScroll が調整） */
.hero .allday { font-size: calc(var(--u) * 1.9 * var(--hz)); font-weight: 700; opacity: .94; }
.hero.quiet { background: var(--paper); color: var(--ink); border: .18rem dashed var(--mute); }
.hero { --hz: min(var(--z), 1.2); }
.hero .lab { font-size: calc(var(--u) * 1.8 * var(--hz)); font-weight: 700; opacity: .88; }
.hero .ti { font-size: calc(var(--u) * 3.6 * var(--hz)); font-weight: 800; line-height: 1.15; text-wrap: balance; }
.hero .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: .4rem 1.5rem; margin-top: .3rem; }
.hero .cnt { font-size: calc(var(--u) * 3 * var(--hz)); font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: auto; }
.hero .meta { font-size: calc(var(--u) * 2 * var(--hz)); opacity: .94; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero.quiet .ti { font-size: calc(var(--u) * 2.8 * var(--hz)); }

h2 { margin: .3rem 0 .4rem; font-size: 1.9rem; font-weight: 700; color: var(--sub); }
.dayh { margin: 1.4rem 0 .3rem; font-size: 2.3rem; font-weight: 800; color: var(--accent); }
[data-theme="night"] .dayh { color: var(--accent); }

/* ---- 予定の1行（押すと大きく表示） ---- */
.row {
  width: 100%; min-height: 7.4rem; display: grid; grid-template-columns: 10rem minmax(0, 1fr) auto; align-items: center; gap: 1.2rem;
  padding: .8rem 1.1rem; border-top: .1rem solid var(--line);
}
.row:active { background: var(--accent-soft); }
.row .t { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .ap { font-size: 1.4rem; color: var(--sub); margin-right: .3rem; }
.row .hm { font-size: 2.7rem; font-weight: 800; }
.row .hm.all { font-size: 2.2rem; color: var(--sub); }
.row .ti { font-size: 2.6rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.row .lo { font-size: 1.8rem; color: var(--sub); margin-top: .2rem; }
.row .st { font-size: 1.7rem; font-weight: 700; color: var(--mute); white-space: nowrap; }
.row .go { font-size: 2.6rem; color: var(--mute); }
.row.past .ti, .row.past .hm, .row.past .lo, .row.past .ap { color: var(--mute); font-weight: 600; }
.row.cur, .row.next { border-top-color: transparent; background: var(--accent-soft); border-radius: .8rem; box-shadow: inset .55rem 0 0 var(--accent); }
.row.cur .st, .row.next .st { color: var(--accent); }
.empty { padding: 1.6rem 1.1rem; font-size: 2.4rem; color: var(--sub); border-top: .1rem solid var(--line); }

/* ---- やること（押すとチェック） ---- */
.todo {
  width: 100%; min-height: 8.6rem; display: grid; grid-template-columns: 5.4rem minmax(0, 1fr); align-items: center; gap: 1.6rem;
  padding: 1rem 1.2rem; border-top: .1rem solid var(--line);
}
.todo:active { background: var(--accent-soft); }
.todo.fixed:active { background: transparent; }
.todo .box { width: 4.8rem; height: 4.8rem; border-radius: 50%; border: .4rem solid var(--accent); position: relative; background: var(--panel); }
.todo .ti { font-size: 3rem; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.todo .sub { font-size: 1.9rem; color: var(--sub); margin-top: .2rem; }
.todo.done .box { background: var(--ok); border-color: var(--ok); }
.todo.done .box::after { content: ""; position: absolute; left: 1.3rem; top: .4rem; width: 1.3rem; height: 2.5rem; border: solid #fff; border-width: 0 .5rem .5rem 0; transform: rotate(45deg); }
.todo.done .ti { color: var(--mute); text-decoration: line-through; font-weight: 600; }

/* ---- ひるねタイマー ---- */
.napbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; margin-top: 1.2rem; }
.napbtn {
  min-height: 19rem; border-radius: 1.6rem; background: var(--accent); color: var(--accent-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; text-align: center;
}
.napbtn:active { transform: scale(.98); }
.napbtn .n { font-family: var(--serif); font-size: 9rem; font-weight: 900; line-height: 1; }
.napbtn .n small { font-size: 4rem; margin-left: .3rem; font-family: var(--ff); }
.napbtn .d { font-size: 2.2rem; font-weight: 700; opacity: .92; }
.napnote { font-size: 2.2rem; color: var(--sub); margin-top: 1.4rem; line-height: 1.5; }
.napgo { display: flex; flex-wrap: wrap; align-items: center; gap: 2rem 3rem; margin-top: .8rem; }
.ring { position: relative; width: min(28rem, 100%); aspect-ratio: 1; flex: none; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .mid .k { font-size: 2rem; color: var(--sub); font-weight: 700; }
.ring .mid .v { font-size: 6.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.napside { flex: 1 1 22rem; min-width: 0; display: flex; flex-direction: column; gap: 1.4rem; }
.napside .at { font-size: 2.6rem; font-weight: 700; line-height: 1.4; }
.napstop { min-height: 8rem; border-radius: 1.4rem; border: .25rem solid var(--ink); font-size: 3rem; font-weight: 800; text-align: center; }

/* ---- 大きく表示（予定を押したとき） ---- */
.sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 2rem; z-index: 5; }
.sheet[hidden] { display: none; }
.card { background: var(--panel); border-radius: 1.6rem; width: min(100%, 72rem); max-height: 100%; overflow-y: auto; padding: 2.4rem 2.6rem; display: flex; flex-direction: column; gap: 1.2rem; }
.card .c-ti { font-size: 4.2rem; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.card .c-when { font-size: 2.8rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
[data-theme="night"] .card .c-when { color: var(--accent); }
.card .c-lo { font-size: 2.6rem; font-weight: 700; }
.card .c-no { font-size: 2.4rem; color: var(--sub); white-space: pre-wrap; line-height: 1.4; }
.card .close { margin-top: .6rem; min-height: 7rem; border-radius: 1.2rem; background: var(--accent); color: var(--accent-ink); font-size: 3rem; font-weight: 800; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 6; width: max-content; max-width: min(92vw, 80rem); display: flex; align-items: center; gap: 2rem;
  background: var(--ink); color: var(--paper); padding: 1.2rem 1.4rem 1.2rem 2.4rem; border-radius: 1.6rem; font-size: 2.3rem; font-weight: 700; line-height: 1.3; }
.toast[hidden] { display: none; }
.toast button { flex: none; white-space: nowrap; background: var(--accent); color: var(--accent-ink); border-radius: 1.2rem; padding: 1.2rem 2.4rem; font-size: 2.6rem; font-weight: 800; }
.hint { position: absolute; left: 50%; bottom: .4rem; transform: translateX(-50%); padding: .6rem 1.8rem; border-radius: 99rem; background: var(--ink); color: var(--paper); font-size: calc(var(--u) * 1.8); font-weight: 700; pointer-events: none; opacity: .92; white-space: nowrap; }
.hint[hidden] { display: none; }
.net { position: fixed; left: 50%; top: 1rem; transform: translateX(-50%); background: #8A4B00; color: #fff; font-size: calc(var(--u) * 1.8); font-weight: 700; padding: .7rem 1.6rem; border-radius: 99rem; z-index: 4; white-space: nowrap; }
.net[hidden] { display: none; }

/* ---- おしらせ（予定が近づいたとき・ひるねの終わり）：画面いっぱいに大きく ---- */
.alert {
  position: fixed; inset: 0; z-index: 9; background: var(--accent); color: var(--accent-ink);
  display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.1); text-align: center; overflow-y: auto;
  padding: calc(var(--u) * 1.8) calc(var(--u) * 3.4); animation: pulse 2.6s ease-in-out infinite;
}
.alert[hidden] { display: none; }
.alert.now { background: var(--red); color: #fff; }
[data-theme="night"] .alert.now { color: #2a0a03; }
.alert .a-lab { font-size: calc(var(--u) * 3.2); font-weight: 800; }
.alert .a-ti { font-size: calc(var(--u) * 6.2); font-weight: 900; line-height: 1.12; text-wrap: balance; }
.alert .a-ti.long { font-size: calc(var(--u) * 4.8); }
.alert .a-when { font-size: calc(var(--u) * 3.2); font-weight: 700; font-variant-numeric: tabular-nums; }
.alert .a-cnt { font-size: calc(var(--u) * 4.8); font-weight: 900; font-variant-numeric: tabular-nums; }
.alert .a-loc { font-size: calc(var(--u) * 2.8); font-weight: 700; }
.alert .a-note { font-size: calc(var(--u) * 1.8); min-height: 1em; opacity: .9; }
.alert .a-ok { margin-top: calc(var(--u) * 1.4); min-height: calc(var(--u) * 8.5); flex: none; border-radius: calc(var(--u) * 1.8); background: #fff; color: #1B1D22; font-size: calc(var(--u) * 4.2); font-weight: 900; text-align: center; }
.alert .a-ok:active { transform: scale(.98); }
@keyframes pulse { 50% { filter: brightness(1.14); } }
@media (prefers-reduced-motion: reduce) { .alert { animation: none; } .ring .fg { transition: none; } }

/* ---- 縦向き（iPadを縦に置いたとき） ---- */
@media (max-aspect-ratio: 1/1) {
  html { font-size: calc(min(2.3vw, 1.5vh) * var(--z)); }
  .app { padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6); gap: calc(var(--u) * 1.1); grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "cal" "view" "tabs"; }
  .cal { flex-direction: row; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * .8) calc(var(--u) * 1.6); padding-bottom: 0; overflow: visible; }
  .daycard { display: flex; align-items: baseline; gap: calc(var(--u) * .6); padding: 0; background: none; box-shadow: none; text-align: left; border-radius: 0; }
  .daycard .bind { display: none; }
  .daycard .mo { font-size: calc(var(--u) * 4); font-weight: 800; color: var(--ink); }
  .daycard .dd { font-size: calc(var(--u) * 4.4); font-weight: 900; font-family: var(--ff); }
  .daycard .dsuf { display: inline; font-size: calc(var(--u) * 4); font-weight: 800; margin-left: calc(var(--u) * -.3); }
  .daycard .wk { font-size: calc(var(--u) * 2.6); color: var(--sub); }
  .daycard.sun .mo, .daycard.sun .dsuf { color: var(--red); } .daycard.sat .mo, .daycard.sat .dsuf { color: var(--blue); }
  .clock { margin-left: auto; } .clock .hm { font-size: calc(var(--u) * 4.4); }
  .greet { display: none; }
  .napchip { order: 5; flex: 1 1 100%; }
  .tools { margin-top: 0; width: 100%; order: 6; }
  .tool { min-height: calc(var(--u) * 4.4); flex-direction: row; align-items: center; justify-content: center; gap: calc(var(--u) * .8); }
  .tool .k { font-size: calc(var(--u) * 1.5); } .tool .v { font-size: calc(var(--u) * 1.8); }
  .tab { min-height: calc(var(--u) * 7.8); font-size: calc(var(--u) * 1.6); }
  .tab svg { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); }
  .napbtns { grid-template-columns: 1fr; }
  .alert .a-ti { font-size: calc(var(--u) * 7.2); } .alert .a-ti.long { font-size: calc(var(--u) * 5.2); }
  .alert .a-lab, .alert .a-when { font-size: calc(var(--u) * 3.6); } .alert .a-cnt { font-size: calc(var(--u) * 5.4); }
  .alert .a-ok { min-height: calc(var(--u) * 9.5); font-size: calc(var(--u) * 4.6); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="cal">
    <div class="daycard" id="daycard"></div>
    <div class="clock" id="clock"></div>
    <div class="greet" id="greet"></div>
    <button class="napchip" id="napchip" data-view="nap" hidden></button>
    <div class="tools" id="tools"></div>
  </aside>
  <nav class="tabs" id="tabs"></nav>
  <div class="viewwrap"><div class="view" id="view"></div><div class="hint" id="hint" hidden>▼ したにも あります</div></div>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<div class="alert" id="alert" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="net" id="net" hidden></div>

<script>
const q = new URLSearchParams(location.search);
const KEY = q.get('key') || '';
const HOUR = 3600e3, DAY = 864e5, JST = 9 * HOUR;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const $ = (id) => document.getElementById(id);

// ?at=17:30 で時刻を仮に動かして見た目を確認できる（動作確認用）
let offset = 0;
if (q.get('at')) {
  const [h, m] = q.get('at').split(':').map(Number);
  const n = Date.now(), j = new Date(n + JST);

/* ---- 文字の大きさ（この端末に覚えておく） ---- */
const SIZES = [[1, 'ふつう'], [1.25, '大'], [1.5, '特大']];

try { const v = Number(localStorage.getItem('sizeIdx')); if (v >= 0 && v < SIZES.length) sizeIdx = v; } catch (e) {}

/* ---- 状態 ---- */
let data = null, lastOk = 0, failed = false;

function norm(e) {

/* ---- アイコン ---- */

/* ---- 画面の部品 ---- */
function rowHtml(e, n, cur, next) {
  const isPast = !e.allDay && e.e <= n, isCur = e === cur, isNext = e === next && !cur;
  const cls = (isCur ? 'cur' : isNext ? 'next' : isPast ? 'past' : '') + (e.allDay ? ' allrow' : '');
  const tag = isCur ? 'いま' : isNext ? '次' : isPast ? 'おわり' : '';
  const t = e.allDay ? '<span class="hm all">終日</span>' : tmHtml(e.s);
  return `<button class="row ${cls}" data-eid="${esc(e.id)}" data-s="${e.s}"><div class="t">${t}</div><div class="w"><div class="ti">${esc(e.title)}</div>${e.location ? `<div class="lo">${esc(e.location)}</div>` : ''}</div><div class="st">${tag || '<span class="go">›</span>'}</div></button>`;
}

function viewToday(evs, n, today) {
  const todays = onDay(evs, today);

  const adTxt = todays.filter((x) => x.allDay).map((x) => esc(x.title)).join('、');
  const heroBtn = (e, lab, f) => `<button class="hero" data-eid="${esc(e.id)}" data-s="${e.s}"><div class="lab">${lab}</div><div class="ti">${esc(e.title)}</div>${f}${adTxt && !e.allDay ? `<div class="allday">きょうは：${adTxt}</div>` : ''}</button>`;
  if (cur) hero = heroBtn(cur, 'いま', foot(rangeText(cur), `${tm(cur.e).ap}${tm(cur.e).hm}まで`));

}

function viewTomorrow(evs, n, today) {
  const list = onDay(evs, today + 1);
  return `<h2>あした ${dayLabel(today + 1)}</h2>` + (list.length ? list.map((e) => rowHtml(e, n)).join('') : '<div class="empty">予定はありません</div>');
}

function viewWeek(evs, n, today) {
  let html = '';

    const list = onDay(evs, k);

function taskRow(t, canCheck, today) {

    const k = dayKey(Date.parse(t.due + 'T00:00:00+09:00'));
    sub = k < today ? 'すぎています' : k === today ? 'きょうまで' : `${dayLabel(k).replace(/（.）/, '')}まで`;
  }
  return `<button class="todo ${t.done ? 'done' : ''} ${canCheck ? '' : 'fixed'}" ${canCheck ? `data-tid="${esc(t.id)}"` : ''}><div class="box"></div><div><div class="ti">${esc(t.title)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></button>`;
}

/* ---- ひるねタイマー（この端末に覚えておくので、ページを開き直しても続く） ---- */
let nap = null;
try { const v = JSON.parse(localStorage.getItem('nap') || 'null'); if (v && v.end > 0 && v.total > 0) nap = v; } catch (e) {}

}

      <div class="napbtns">
        <button class="napbtn" data-nap="15"><div class="n">15<small>分</small></div><div class="d">ちょっと ひとやすみ</div></button>
        <button class="napbtn" data-nap="30"><div class="n">30<small>分</small></div><div class="d">ゆっくり ひるね</div></button>
      </div>

  }
  const e = tm(nap.end);
  return `<h2>ひるね ちゅう</h2>
    <div class="napgo">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="napring" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
        <div class="mid"><div class="k">のこり</div><div class="v" id="napcnt">--:--</div></div></div>
      <div class="napside"><div class="at">${e.ap} ${e.hm} に<br>おしらせします</div><button class="napstop" data-napstop>やめる</button></div>
    </div>`;

  const left = Math.max(0, nap.end - Date.now());
  const mm = Math.floor(left / 60e3), ss = Math.floor(left / 1000) % 60;
  const c = $('napcnt'); if (c) c.textContent = `${pad(mm)}:${pad(ss)}`;

function checkNap() {

  const fresh = Date.now() - nap.end < 5 * 60e3;
  nap = null; saveNap();
  if (fresh) enqueueAlert({ kind: 'nap', title: 'ひるねは おわりです', say: 'ひるねの じかんが おわりました。おきる じかんです。' });

/* ---- 音（iPadは、画面を一度さわるまで音を出せないため、さわったときに準備する） ---- */
let ac = null, audioOn = false, speechPrimed = false;
function setAudioState() { audioOn = !!ac && ac.state === 'running'; renderTools(); }
function unlockAudio() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state !== 'running') ac.resume().then(setAudioState).catch(() => {});
    if (ac) { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); }
    if ('speechSynthesis' in window && !speechPrimed) { speechPrimed = true; const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  } catch (e) {}
  setAudioState();
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach((n) => document.addEventListener(n, () => { if (!audioOn) unlockAudio(); }, { capture: true, passive: true }));

// やわらかい「ピンポーン」。高い音は年をとると聞こえにくいので、低め（500〜700Hz）の音を重ねる
function bell(freq, t0, dur, vol) {
  [[1, vol, 'sine'], [2, vol * .35, 'sine'], [3, vol * .12, 'sine']].forEach(([m, v, type]) => {

  } catch (e) {}

let jaVoice = null;
function speak(text) {
  if (!audioOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    jaVoice = jaVoice || speechSynthesis.getVoices().find((v) => /^ja/i.test(v.lang));
    if (jaVoice) u.voice = jaVoice;
    u.lang = 'ja-JP'; u.rate = .82; u.volume = 1;

/* ---- おしらせ（予定の15分前と、はじまる時刻） ---- */
const STAGES = [{ id: 'pre', lead: 15 * 60e3, win: 4 * 60e3 }, { id: 'now', lead: 0, win: 3 * 60e3 }];
let fired = {};
try { fired = JSON.parse(localStorage.getItem('fired') || '{}') || {}; } catch (e) {}
let alertQ = [], curAlert = null, ringTimer = null, autoTimer = null, ringCount = 0;

function checkAlerts() {
  if (!data) return;
  const n = now();
  for (const raw of data.events || []) {
    const e = norm(raw);
    if (e.allDay) continue;
    for (const st of STAGES) {
      const t0 = e.s - st.lead, key = `${e.id}|${e.s}|${st.id}`;
      if (n >= t0 && n < t0 + st.win && !fired[key]) {
        fired[key] = Date.now();
        for (const k in fired) if (Date.now() - fired[k] > 2 * DAY) delete fired[k];
        try { localStorage.setItem('fired', JSON.stringify(fired)); } catch (er) {}
        enqueueAlert({ kind: st.id, title: e.title, s: e.s, e: e.e, loc: e.location, say: st.id === 'pre' ? `もうすぐ、${e.title}です。あと${Math.round((e.s - n) / 60e3)}分です。` : `${e.title}の、じかんです。` });
      }
    }
  }
}
function enqueueAlert(a) { if (curAlert) alertQ.push(a); else showAlert(a); }
function showAlert(a) {

  if (a.kind === 'nap') {
    inner = `<div class="a-lab">ひるねの じかんが</div><div class="a-ti">おわりました</div><div class="a-when">おきる じかんです</div>`;
  } else {
    const rt = a.e ? rangeText({ s: a.s, e: a.e, allDay: false }) : '';
    inner = `<div class="a-lab">${a.kind === 'pre' ? 'もうすぐ 予定です' : 'じかんです'}</div>
      <div class="a-ti${long}">${esc(a.title)}</div>
      <div class="a-when">${rt}</div>
      ${a.kind === 'pre' ? '<div class="a-cnt" id="a-cnt"></div>' : ''}
      ${a.loc ? `<div class="a-loc">場所：${esc(a.loc)}</div>` : ''}`;
  }
  const el = $('alert');
  el.className = 'alert' + (a.kind === 'now' ? ' now' : '');
  el.innerHTML = inner + `<button class="a-ok" data-ok>${a.kind === 'nap' ? 'おきました' : 'わかりました'}</button>` + `<div class="a-note" id="a-note"></div>`;
  el.hidden = false;
  $('sheet').hidden = true;

/* ---- 描画 ---- */
const greeting = (h) => h >= 5 && h < 10 ? 'おはようございます' : h >= 10 && h < 17 ? 'こんにちは' : h >= 17 && h < 21 ? 'こんばんは' : 'おやすみなさい';
function renderTools() {
  const html = `<button class="tool" data-size><span class="k">もじ</span><span class="v">${SIZES[sizeIdx][1]}</span></button>` +
    `<button class="tool ${audioOn ? '' : 'warn'}" data-sound><span class="k">おと</span><span class="v">${audioOn ? 'オン' : 'おして'}</span></button>`;
  if (lastHtml.tools !== html) { $('tools').innerHTML = html; lastHtml.tools = html; }
}

function render(force) {
  const n = now(), p = parts(n), today = dayKey(n);
  document.documentElement.dataset.theme = q.get('theme') || ((p.h >= 21 || p.h < 6) ? 'night' : 'day');
  applySize();

  const cls = p.wd === 0 ? 'sun' : p.wd === 6 ? 'sat' : '';
  const dayHtml = `<div class="bind"></div><div class="mo">${p.mo}月</div><div class="dd">${p.d}<span class="dsuf">日</span></div><div class="wk">${WD[p.wd]}曜日</div>`;
  if (lastHtml.day !== dayHtml + cls) { $('daycard').className = 'daycard ' + cls; $('daycard').innerHTML = dayHtml; lastHtml.day = dayHtml + cls; }
  const clockHtml = tmHtml(n);
  if (lastHtml.clock !== clockHtml) { $('clock').innerHTML = clockHtml; lastHtml.clock = clockHtml; }
  const g = greeting(p.h); if (lastHtml.greet !== g) { $('greet').textContent = g; lastHtml.greet = g; }
  renderTools();

  const openTasks = (data?.tasks || []).filter((t) => !t.done).length;
  const tab = (id, label, badge) => `<button class="tab" data-view="${id}" aria-selected="${view === id}">${svg(id)}<span>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  const tabsHtml = tab('today', 'きょう') + tab('tomorrow', 'あした') + tab('week', '1週間') + tab('todo', 'やること', openTasks || '') + tab('nap', 'ひるね');
  if (lastHtml.tabs !== tabsHtml) { $('tabs').innerHTML = tabsHtml; lastHtml.tabs = tabsHtml; }

  const evs = (data?.events || []).map(norm);
  const html = view === 'tomorrow' ? viewTomorrow(evs, n, today) : view === 'week' ? viewWeek(evs, n, today) : view === 'todo' ? viewTodo(today) : view === 'nap' ? viewNap() : viewToday(evs, n, today);
  const key = view + '|' + html;
  if (force || lastHtml.view !== key) {
    const el = $('view'), keep = lastHtml.viewName === view ? el.scrollTop : 0;
    el.innerHTML = html; el.scrollTop = keep;
    lastHtml.view = key; lastHtml.viewName = view;
  }
  if (view === 'today') autoScroll(); else lastAnchor = '';
  updateHint(); updateNap();

  const netEl = $('net');
  const old = lastOk && (Date.now() - lastOk > 5 * 60e3);
  if (!data) { netEl.hidden = false; netEl.textContent = failed ? 'よみこめません。しばらくお待ちください' : 'よみこみ中…'; }
  else if (failed || old || data.stale) { netEl.hidden = false; const u = Date.parse(data.updated); netEl.textContent = `ネットにつながっていません（${tm(u).ap}${tm(u).hm} の情報です）`; }
  else netEl.hidden = true;
}

/* ---- きょうの予定：終わったものは上に流して、いまの予定・次の予定を見えるところに出す ---- */
let lastAnchor = '';
function autoScroll() {
  const el = $('view');
  const a = el.querySelector('.row:not(.past):not(.allrow)');
  const tail = el.querySelector('.tail');
  const base = el.getBoundingClientRect().top;
  const hero = el.querySelector('.hero');
  const gap = parseFloat(getComputedStyle(document.documentElement).fontSize) * 2.4;
  // いまの予定（なければ次の予定）を、主役カードのすぐ下に置くための位置
  let target = 0;
  if (a) target = Math.max(0, a.getBoundingClientRect().top - base + el.scrollTop - (hero ? hero.offsetHeight + gap : 0));
  // 下の余白を、ちょうどその位置まで動ける高さにする
  if (tail) {
    const pb = parseFloat(getComputedStyle(el).paddingBottom) || 0;
    const tailTop = tail.getBoundingClientRect().top - base + el.scrollTop;
    tail.style.height = (a ? Math.max(0, target + el.clientHeight - pb - tailTop) : 0) + 'px';
  }
  const id = a ? a.dataset.eid + '|' + a.dataset.s : 'end';
  if (id === lastAnchor) return;
  if (lastAnchor !== '' && Date.now() - lastTouch < 15e3) return;   // 指で動かしている最中は待つ
  const first = lastAnchor === '';
  lastAnchor = id;
  el.scrollTo({ top: a ? target : el.scrollHeight, behavior: first ? 'auto' : 'smooth' });
}

function updateHint() {
  const el = $('view');
  $('hint').hidden = !(el.scrollHeight > el.clientHeight + 8 && el.scrollTop + el.clientHeight < el.scrollHeight - 24);
}

/* ---- 予定を大きく表示 ---- */
function openSheet(id) {
  const e = (data?.events || []).map(norm).find((x) => x.id === id);
  if (!e) return;
  const p = parts(e.s);
  $('card').innerHTML = `<div class="c-ti">${esc(e.title)}</div>
    <div class="c-when">${p.mo}月${p.d}日（${WD[p.wd]}）　${rangeText(e)}</div>
    ${e.location ? `<div class="c-lo">場所：${esc(e.location)}</div>` : ''}
    ${e.notes ? `<div class="c-no">${esc(e.notes)}</div>` : ''}
    <button class="close" data-close>とじる</button>`;
  $('sheet').hidden = false;
}
const closeSheet = () => { $('sheet').hidden = true; };

/* ---- 一時メッセージ（もどすボタンつき） ---- */
let toastTimer = null;
function toast(text, undo) {
  const el = $('toast');
  el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button data-undo>もどす</button>' : ''}`;
  el.hidden = false;
  el._undo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 9000 : 5000);
}

/* ---- やることのチェック ---- */
async function toggleTask(id) {
  const t = (data?.tasks || []).find((x) => x.id === id);
  if (!t || !data.canCheck) return;
  const want = !t.done;
  t.done = want; render(true);
  try {
    const r = await fetch('/api/task?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, done: want }),
    });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failed = false;
    const nm = t.title.length > 14 ? t.title.slice(0, 14) + '…' : t.title;
    toast(want ? `「${nm}」を おわりにしました` : `「${nm}」を もとに もどしました`, want ? () => toggleTask(id) : null);
  } catch (e) {
    t.done = !want;
    toast('チェックできませんでした。もう一度 おしてください');
  }
  render(true);
}

/* ---- 触ったときの動き ---- */
document.addEventListener('click', (ev) => {
  lastTouch = Date.now();
  const t = ev.target.closest('button, [data-close]');
  if (ev.target === $('sheet')) return closeSheet();
  if (!t) return;
  if (t.hasAttribute('data-ok')) return dismissAlert();
  if (t.dataset.view) { view = t.dataset.view; $('view').scrollTop = 0; lastAnchor = ''; render(true); return; }
  if (t.hasAttribute('data-size')) { sizeIdx = (sizeIdx + 1) % SIZES.length; try { localStorage.setItem('sizeIdx', String(sizeIdx)); } catch (e) {} render(true); return; }
  if (t.hasAttribute('data-sound')) { unlockAudio(); setTimeout(() => chime(false), 150); return; }
  if (t.dataset.nap) return startNap(Number(t.dataset.nap));
  if (t.hasAttribute('data-napstop')) return stopNap();
  if (t.dataset.eid) return openSheet(t.dataset.eid);
  if (t.dataset.tid) return toggleTask(t.dataset.tid);
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-undo')) { const u = $('toast')._undo; $('toast').hidden = true; if (u) u(); }
});
$('view').addEventListener('scroll', updateHint, { passive: true });
['touchstart', 'pointerdown', 'scroll'].forEach((n) => document.addEventListener(n, () => { lastTouch = Date.now(); }, { passive: true, capture: true }));
// 拡大・ダブルタップでの拡大を止める
['gesturestart', 'gesturechange', 'dblclick'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// しばらく触らなければ「きょう」に戻す（シートは1分、ひるね中の画面は5分、他は2分）
setInterval(() => {
  const idle = Date.now() - lastTouch;
  if (!$('sheet').hidden && idle > 60e3) closeSheet();
  if (view !== 'today' && idle > (view === 'nap' && nap ? 300e3 : 120e3)) { view = 'today'; $('view').scrollTop = 0; lastAnchor = ''; render(true); }
}, 5e3);

async function load() {
  try {
    const r = await fetch('/api/data?key=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failed = false;
    if (data.version) { if (!pageVer) pageVer = data.version; else if (data.version !== pageVer) pendingReload = true; }
  } catch (e) { failed = true; }
  render(); checkAlerts();
}
load();
setInterval(load, 60e3);
setInterval(() => render(), 5e3);
setInterval(() => { checkAlerts(); checkNap(); updateNap(); updateAlertCount(); }, 1000);
window.addEventListener('resize', updateHint);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
// 新しい版のページが出たときだけ読み込み直す（毎日は読み込み直さないので、音の準備が保たれる）。
// おしらせ中は待ち、しばらく触られていないときに行う。
setInterval(() => { if (pendingReload && !curAlert && Date.now() - lastTouch > 20e3) location.reload(); }, 5e3);
(async function keepAwake() {
  try { if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); } } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); }, { once: true });
})();
</script>
</body>
