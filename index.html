<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EFF3F4">
<title>予定表</title>
<style>
:root {
  --paper: #EFF3F4;   /* 地の色：青みのある薄い灰 */
  --panel: #FFFFFF;
  --ink: #13242B;     /* 文字：黒に近い藍 */
  --sub: #4A5F67;
  --mute: #8C9EA6;
  --line: #D2DCE0;
  --accent: #00677A;  /* 「いま」「次」「えらんでいる場所」だけに使う青緑 */
  --accent-ink: #FFFFFF;
  --accent-soft: #D5EAEF;
  --z: 1;             /* 文字の大きさ（ボタンで変える。予定やToDoの中身だけに効く） */
  --u: calc(1rem / var(--z));   /* 文字の大きさに左右されない 1rem（ボタンや日付用） */
}
[data-theme="night"] {
  --paper: #0B1519; --panel: #122128; --ink: #E8F1F3; --sub: #A3B8BF; --mute: #5C7078;
  --line: #213640; --accent: #58C2D4; --accent-ink: #052329; --accent-soft: #123640;
}
* { box-sizing: border-box; }
html { font-size: calc(min(1.5vw, 2vh) * var(--z)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; height: 100dvh; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  font-weight: 500; line-height: 1.25;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; }

/* ---- 全体：横向きは左に大きなボタン、縦向きは下に大きなボタン ---- */
.app {
  height: 100dvh; padding: 1.6rem 2rem 1.6rem 1.6rem;
  display: grid; gap: 1rem 2rem;
  grid-template-columns: min(calc(var(--u) * 14), 24vw) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "rail top" "rail view";
}
.rail { grid-area: rail; display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .2rem 2rem; min-width: 0; }
.viewwrap { grid-area: view; position: relative; min-height: 0; }
.view { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 1rem; }
.view::-webkit-scrollbar { display: none; }

.tab {
  flex: 1; min-height: calc(var(--u) * 6.5); border-radius: 1.2rem; background: var(--panel); border: .2rem solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem;
  font-size: calc(var(--u) * 2.5); font-weight: 800;
}
.tab:active { transform: scale(.97); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.badge { min-width: calc(var(--u) * 3); padding: .1rem calc(var(--u) * .8); border-radius: 99rem; background: var(--accent); color: var(--accent-ink); font-size: calc(var(--u) * 1.8); font-weight: 800; text-align: center; }
.tab[aria-selected="true"] .badge { background: var(--accent-ink); color: var(--accent); }
.size { flex: none; padding: calc(var(--u) * .9) calc(var(--u) * .4); border-radius: 1rem; border: .15rem dashed var(--mute); color: var(--sub); font-size: calc(var(--u) * 1.6); font-weight: 700; text-align: center; }

.date { display: flex; align-items: baseline; gap: 1.2rem; }
.md { font-size: calc(var(--u) * 4.4); font-weight: 800; white-space: nowrap; }
.wd { font-size: calc(var(--u) * 2.6); font-weight: 700; color: var(--sub); white-space: nowrap; }
.wd.sun, .wd.sat { color: var(--accent); }
.clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock .ap { font-size: calc(var(--u) * 1.8); color: var(--sub); margin-right: .5rem; }
.clock .hm { font-size: calc(var(--u) * 4.4); font-weight: 800; }

/* ---- きょうの主役 ---- */
.hero {
  display: flex; flex-direction: column; gap: .5rem; width: 100%;
  background: var(--accent); color: var(--accent-ink); border-radius: 1.2rem; padding: 1.2rem 1.8rem 1.3rem; margin-bottom: 1.3rem;
}
.hero.quiet { background: var(--panel); color: var(--ink); border: .15rem solid var(--line); }
.hero .lab { font-size: 1.7rem; font-weight: 700; opacity: .85; }
.hero .ti { font-size: 3.3rem; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.hero .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: .4rem 1.5rem; margin-top: .3rem; }
.hero .cnt { font-size: 2.8rem; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: auto; }
.hero .meta { font-size: 1.9rem; opacity: .92; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero.quiet .ti { font-size: 2.8rem; }

h2 { margin: .3rem 0 .5rem; font-size: 1.8rem; font-weight: 700; color: var(--sub); }
.dayh { margin: 1.4rem 0 .3rem; font-size: 2.2rem; font-weight: 800; color: var(--accent); }

/* ---- 予定の1行（押すと大きく表示） ---- */
.row {
  width: 100%; min-height: 7rem; display: grid; grid-template-columns: 10rem minmax(0, 1fr) auto; align-items: center; gap: 1.2rem;
  padding: .8rem 1.1rem; border-top: .1rem solid var(--line);
}
.row:active { background: var(--accent-soft); }
.row .t { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .ap { font-size: 1.4rem; color: var(--sub); margin-right: .3rem; }
.row .hm { font-size: 2.6rem; font-weight: 800; }
.row .hm.all { font-size: 2.2rem; color: var(--sub); }
.row .ti { font-size: 2.5rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.row .lo { font-size: 1.7rem; color: var(--sub); margin-top: .2rem; }
.row .st { font-size: 1.6rem; font-weight: 700; color: var(--mute); white-space: nowrap; }
.row .go { font-size: 2.4rem; color: var(--mute); }
.row.past .ti, .row.past .hm, .row.past .lo, .row.past .ap { color: var(--mute); font-weight: 600; }
.row.cur, .row.next { border-top-color: transparent; background: var(--accent-soft); border-radius: .8rem; box-shadow: inset .5rem 0 0 var(--accent); }
.row.cur .st, .row.next .st { color: var(--accent); }
.empty { padding: 1.6rem 1.1rem; font-size: 2.4rem; color: var(--sub); border-top: .1rem solid var(--line); }

/* ---- やること（押すとチェック） ---- */
.todo {
  width: 100%; min-height: 8rem; display: grid; grid-template-columns: 5rem minmax(0, 1fr); align-items: center; gap: 1.6rem;
  padding: 1rem 1.2rem; margin-bottom: .9rem; background: var(--panel); border-radius: 1.2rem; border: .15rem solid var(--line);
}
.todo:active { background: var(--accent-soft); }
.todo.fixed:active { background: var(--panel); }
.todo .box { width: 4.6rem; height: 4.6rem; border-radius: 50%; border: .4rem solid var(--accent); position: relative; }
.todo .ti { font-size: 2.9rem; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.todo .sub { font-size: 1.8rem; color: var(--sub); margin-top: .2rem; }
.todo.done { background: transparent; border-style: dashed; }
.todo.done .box { background: var(--accent); }
.todo.done .box::after { content: ""; position: absolute; left: 1.2rem; top: .5rem; width: 1.2rem; height: 2.3rem; border: solid var(--accent-ink); border-width: 0 .5rem .5rem 0; transform: rotate(45deg); }
.todo.done .ti { color: var(--mute); text-decoration: line-through; font-weight: 600; }

/* ---- 大きく表示（予定を押したとき） ---- */
.sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; padding: 2rem; z-index: 5; }
.sheet[hidden] { display: none; }
.card { background: var(--panel); border-radius: 1.6rem; width: min(100%, 72rem); max-height: 100%; overflow-y: auto; padding: 2.4rem 2.6rem; display: flex; flex-direction: column; gap: 1.2rem; }
.card .c-ti { font-size: 4.2rem; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.card .c-when { font-size: 2.8rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.card .c-lo { font-size: 2.6rem; font-weight: 700; }
.card .c-no { font-size: 2.4rem; color: var(--sub); white-space: pre-wrap; line-height: 1.4; }
.card .close { margin-top: .6rem; min-height: 7rem; border-radius: 1.2rem; background: var(--accent); color: var(--accent-ink); font-size: 3rem; font-weight: 800; text-align: center; }

.toast { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); z-index: 6; width: max-content; max-width: min(92vw, 80rem); display: flex; align-items: center; gap: 2rem;
  background: var(--ink); color: var(--paper); padding: 1.2rem 1.4rem 1.2rem 2.4rem; border-radius: 1.6rem; font-size: 2.3rem; font-weight: 700; line-height: 1.3; }
.toast[hidden] { display: none; }
.toast button { flex: none; white-space: nowrap; background: var(--accent); color: var(--accent-ink); border-radius: 1.2rem; padding: 1.2rem 2.4rem; font-size: 2.6rem; font-weight: 800; }
.hint { position: absolute; left: 50%; bottom: .4rem; transform: translateX(-50%); padding: .6rem 1.8rem; border-radius: 99rem; background: var(--ink); color: var(--paper); font-size: calc(var(--u) * 1.8); font-weight: 700; pointer-events: none; opacity: .9; white-space: nowrap; }
.hint[hidden] { display: none; }
.net { position: fixed; left: 50%; top: 1rem; transform: translateX(-50%); background: #8A4B00; color: #fff; font-size: 1.8rem; font-weight: 700; padding: .7rem 1.6rem; border-radius: 99rem; z-index: 4; }
.net[hidden] { display: none; }

@media (max-aspect-ratio: 1/1) {
  html { font-size: calc(min(2.3vw, 1.5vh) * var(--z)); }
  .app { padding: 1.4rem 1.8rem 1.4rem; gap: 1rem; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "view" "rail"; }
  .rail { flex-direction: row; }
  .rail { gap: .8rem; }
  .tab { min-width: 0; min-height: calc(var(--u) * 7); font-size: calc(var(--u) * 1.65); padding: 0; white-space: nowrap; }
  .rail { gap: .5rem; }
  .size { width: calc(var(--u) * 7); padding: .4rem .1rem; font-size: calc(var(--u) * 1.5); }
  .size .l { display: none; }
  .md { font-size: calc(var(--u) * 4); } .clock .hm { font-size: calc(var(--u) * 4); }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <header class="top"><div class="date" id="date"></div><div class="clock" id="clock"></div></header>
  <div class="viewwrap"><div class="view" id="view"></div><div class="hint" id="hint" hidden>▼ したにも あります</div></div>
</div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="net" id="net" hidden></div>

<script>
const q = new URLSearchParams(location.search);
const KEY = q.get('key') || '';
const HOUR = 3600e3, DAY = 864e5, JST = 9 * HOUR;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const $ = (id) => document.getElementById(id);

// ?at=17:30 で時刻を仮に動かして見た目を確認できる（動作確認用）
let offset = 0;
if (q.get('at')) {
  const [h, m] = q.get('at').split(':').map(Number);
  const n = Date.now(), j = new Date(n + JST);
  j.setUTCHours(h, m || 0, 0, 0);
  offset = (j.getTime() - JST) - n;
}
const now = () => Date.now() + offset;
const parts = (ms) => { const j = new Date(ms + JST); return { y: j.getUTCFullYear(), mo: j.getUTCMonth() + 1, d: j.getUTCDate(), wd: j.getUTCDay(), h: j.getUTCHours(), mi: j.getUTCMinutes() }; };
const dayKey = (ms) => Math.floor((ms + JST) / DAY);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tm = (ms) => { const p = parts(ms); return { ap: p.h < 12 ? '午前' : '午後', hm: `${p.h <= 12 ? p.h : p.h - 12}:${pad(p.mi)}` }; };
const tmHtml = (ms) => { const t = tm(ms); return `<span class="ap">${t.ap}</span><span class="hm">${t.hm}</span>`; };
const until = (ms) => { const m = Math.max(1, Math.ceil(ms / 60e3)); if (m < 60) return `あと${m}分`; const h = Math.floor(m / 60), r = m % 60; return r ? `あと${h}時間${r}分` : `あと${h}時間`; };
const dayLabel = (k) => { const p = parts(k * DAY - JST); return `${p.mo}月${p.d}日（${WD[p.wd]}）`; };

/* ---- 文字の大きさ（この端末に覚えておく） ---- */
const SIZES = [[1, 'ふつう'], [1.25, '大'], [1.5, '特大']];
let sizeIdx = 0;
try { const v = Number(localStorage.getItem('sizeIdx')); if (v >= 0 && v < SIZES.length) sizeIdx = v; } catch (e) {}
if (q.get('z') != null) { sizeIdx = Math.min(SIZES.length - 1, Math.max(0, Number(q.get('z')) | 0)); try { localStorage.setItem('sizeIdx', String(sizeIdx)); } catch (e) {} }
const applySize = () => document.documentElement.style.setProperty('--z', SIZES[sizeIdx][0]);

/* ---- 状態 ---- */
let data = null, lastOk = 0, failed = false;
let view = q.get('view') || 'today';
let lastTouch = Date.now();
let lastHtml = {};

function norm(e) {
  const allDay = !!e.allDay;
  const s = allDay ? Date.parse(e.start + 'T00:00:00+09:00') : Date.parse(e.start);
  let en = allDay ? Date.parse(e.end + 'T00:00:00+09:00') : Date.parse(e.end);
  if (!(en > s)) en = s + 1;
  return { ...e, s, e: en };
}
const onDay = (evs, k) => evs.filter((e) => dayKey(e.s) <= k && dayKey(e.e - 1) >= k).sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s));

function rangeText(e) {
  if (e.allDay) return '終日';
  const a = tm(e.s), b = tm(e.e);
  return `${a.ap} ${a.hm} 〜 ${a.ap === b.ap ? '' : b.ap + ' '}${b.hm}`;
}

/* ---- 画面の部品 ---- */
function rowHtml(e, n, cur, next) {
  const isPast = !e.allDay && e.e <= n, isCur = e === cur, isNext = e === next && !cur;
  const cls = isCur ? 'cur' : isNext ? 'next' : isPast ? 'past' : '';
  const tag = isCur ? 'いま' : isNext ? '次' : isPast ? 'おわり' : '';
  const t = e.allDay ? '<span class="hm all">終日</span>' : tmHtml(e.s);
  return `<button class="row ${cls}" data-eid="${esc(e.id)}" data-s="${e.s}"><div class="t">${t}</div><div class="w"><div class="ti">${esc(e.title)}</div>${e.location ? `<div class="lo">${esc(e.location)}</div>` : ''}</div><div class="st">${tag || '<span class="go">›</span>'}</div></button>`;
}

function viewToday(evs, n, today) {
  const todays = onDay(evs, today);
  const timed = todays.filter((e) => !e.allDay);
  const cur = timed.find((e) => e.s <= n && n < e.e);
  const next = timed.find((e) => e.s > n);
  const allDay = todays.find((e) => e.allDay);
  let hero;
  const foot = (meta, cnt) => `<div class="foot"><div class="meta">${meta}</div><div class="cnt">${cnt}</div></div>`;
  const heroBtn = (e, lab, f) => `<button class="hero" data-eid="${esc(e.id)}" data-s="${e.s}"><div class="lab">${lab}</div><div class="ti">${esc(e.title)}</div>${f}</button>`;
  if (cur) hero = heroBtn(cur, 'いま', foot(rangeText(cur), `${tm(cur.e).ap}${tm(cur.e).hm}まで`));
  else if (next) hero = heroBtn(next, '次の予定', foot(rangeText(next), until(next.s - n)));
  else if (allDay) hero = heroBtn(allDay, 'きょう', foot('終日', ''));
  else {
    const tmr = onDay(evs, today + 1).find((e) => !e.allDay);
    hero = `<section class="hero quiet"><div class="ti">${timed.length ? 'きょうの予定は おわりました' : 'きょうは 予定がありません'}</div>${tmr ? foot(`あしたは ${tm(tmr.s).ap} ${tm(tmr.s).hm} から ${esc(tmr.title)}`, '') : ''}</section>`;
  }
  return hero + `<h2>きょうの予定</h2>` + (todays.length ? todays.map((e) => rowHtml(e, n, cur, next)).join('') : '<div class="empty">予定はありません</div>');
}

function viewTomorrow(evs, n, today) {
  const list = onDay(evs, today + 1);
  return `<h2>あした ${dayLabel(today + 1)}</h2>` + (list.length ? list.map((e) => rowHtml(e, n)).join('') : '<div class="empty">予定はありません</div>');
}

function viewWeek(evs, n, today) {
  let html = '';
  for (let k = today + 1; k <= today + 7; k++) {
    const list = onDay(evs, k);
    if (!list.length) continue;
    const name = k === today + 1 ? 'あした　' : k === today + 2 ? 'あさって　' : '';
    html += `<div class="dayh">${name}${dayLabel(k)}</div>` + list.map((e) => rowHtml(e, n)).join('');
  }
  return `<h2>これからの1週間</h2>` + (html || '<div class="empty">1週間は予定がありません</div>');
}

function taskRow(t, canCheck, today) {
  let sub = '';
  if (t.due && !t.done) {
    const k = dayKey(Date.parse(t.due + 'T00:00:00+09:00'));
    sub = k < today ? 'すぎています' : k === today ? 'きょうまで' : `${dayLabel(k).replace(/（.）/, '')}まで`;
  }
  return `<button class="todo ${t.done ? 'done' : ''} ${canCheck ? '' : 'fixed'}" ${canCheck ? `data-tid="${esc(t.id)}"` : ''}><div class="box"></div><div><div class="ti">${esc(t.title)}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></button>`;
}
function viewTodo(today) {
  const tasks = data?.tasks || [], can = !!data?.canCheck;
  const open = tasks.filter((t) => !t.done), done = tasks.filter((t) => t.done);
  let html = `<h2>やること${can ? '（おしてチェック）' : ''}</h2>`;
  html += open.length ? open.map((t) => taskRow(t, can, today)).join('') : `<div class="empty">${done.length ? 'ぜんぶ できました！' : 'やることは ありません'}</div>`;
  if (done.length) html += `<h2 style="margin-top:1.6rem">きょう できたこと</h2>` + done.map((t) => taskRow(t, can, today)).join('');
  return html;
}

/* ---- 描画 ---- */
function render(force) {
  const n = now(), p = parts(n), today = dayKey(n);
  document.documentElement.dataset.theme = q.get('theme') || ((p.h >= 21 || p.h < 6) ? 'night' : 'day');
  applySize();

  const dateHtml = `<span class="md">${p.mo}月${p.d}日</span><span class="wd ${p.wd === 0 ? 'sun' : p.wd === 6 ? 'sat' : ''}">${WD[p.wd]}曜日</span>`;
  if (lastHtml.date !== dateHtml) { $('date').innerHTML = dateHtml; lastHtml.date = dateHtml; }
  const clockHtml = tmHtml(n);
  if (lastHtml.clock !== clockHtml) { $('clock').innerHTML = clockHtml; lastHtml.clock = clockHtml; }

  const openTasks = (data?.tasks || []).filter((t) => !t.done).length;
  const tab = (id, label, badge) => `<button class="tab" data-view="${id}" aria-selected="${view === id}">${label}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  const railHtml = tab('today', 'きょう') + tab('tomorrow', 'あした') + tab('week', '1週間') + tab('todo', 'やること', openTasks || '') +
    `<button class="size" data-size><span class="l">もじの大きさ<br></span>${SIZES[sizeIdx][1]}</button>`;
  if (lastHtml.rail !== railHtml) { $('rail').innerHTML = railHtml; lastHtml.rail = railHtml; }

  const evs = (data?.events || []).map(norm);
  const html = view === 'tomorrow' ? viewTomorrow(evs, n, today) : view === 'week' ? viewWeek(evs, n, today) : view === 'todo' ? viewTodo(today) : viewToday(evs, n, today);
  const key = view + '|' + html;
  if (force || lastHtml.view !== key) {
    const el = $('view'), keep = lastHtml.viewName === view ? el.scrollTop : 0;
    el.innerHTML = html; el.scrollTop = keep;
    lastHtml.view = key; lastHtml.viewName = view;
  }
  updateHint();

  const netEl = $('net');
  const old = lastOk && (Date.now() - lastOk > 5 * 60e3);
  if (!data) { netEl.hidden = false; netEl.textContent = failed ? 'よみこめません。しばらくお待ちください' : 'よみこみ中…'; }
  else if (failed || old || data.stale) { netEl.hidden = false; const u = Date.parse(data.updated); netEl.textContent = `ネットにつながっていません（${tm(u).ap}${tm(u).hm} の情報です）`; }
  else netEl.hidden = true;
}

function updateHint() {
  const el = $('view');
  $('hint').hidden = !(el.scrollHeight > el.clientHeight + 8 && el.scrollTop + el.clientHeight < el.scrollHeight - 24);
}

/* ---- 予定を大きく表示 ---- */
function openSheet(id, s) {
  const e = (data?.events || []).map(norm).find((x) => x.id === id);
  if (!e) return;
  const p = parts(e.s);
  $('card').innerHTML = `<div class="c-ti">${esc(e.title)}</div>
    <div class="c-when">${p.mo}月${p.d}日（${WD[p.wd]}）　${rangeText(e)}</div>
    ${e.location ? `<div class="c-lo">場所：${esc(e.location)}</div>` : ''}
    ${e.notes ? `<div class="c-no">${esc(e.notes)}</div>` : ''}
    <button class="close" data-close>とじる</button>`;
  $('sheet').hidden = false;
}
const closeSheet = () => { $('sheet').hidden = true; };

/* ---- 一時メッセージ（もどすボタンつき） ---- */
let toastTimer = null;
function toast(text, undo) {
  const el = $('toast');
  el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button data-undo>もどす</button>' : ''}`;
  el.hidden = false;
  el._undo = undo || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 9000 : 5000);
}

/* ---- やることのチェック ---- */
async function toggleTask(id) {
  const t = (data?.tasks || []).find((x) => x.id === id);
  if (!t || !data.canCheck) return;
  const want = !t.done;
  t.done = want; render(true);
  try {
    const r = await fetch('/api/task?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, done: want }),
    });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failed = false;
    const nm = t.title.length > 14 ? t.title.slice(0, 14) + '…' : t.title;
    toast(want ? `「${nm}」を おわりにしました` : `「${nm}」を もとに もどしました`, want ? () => toggleTask(id) : null);
  } catch (e) {
    t.done = !want;
    toast('チェックできませんでした。もう一度 おしてください');
  }
  render(true);
}

/* ---- 触ったときの動き ---- */
document.addEventListener('click', (ev) => {
  lastTouch = Date.now();
  const t = ev.target.closest('button, [data-close]');
  if (ev.target === $('sheet')) return closeSheet();
  if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; $('view').scrollTop = 0; render(true); return; }
  if (t.hasAttribute('data-size')) { sizeIdx = (sizeIdx + 1) % SIZES.length; try { localStorage.setItem('sizeIdx', String(sizeIdx)); } catch (e) {} render(true); return; }
  if (t.dataset.eid) return openSheet(t.dataset.eid, t.dataset.s);
  if (t.dataset.tid) return toggleTask(t.dataset.tid);
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-undo')) { const u = $('toast')._undo; $('toast').hidden = true; if (u) u(); }
});
$('view').addEventListener('scroll', updateHint, { passive: true });
['touchstart', 'pointerdown', 'scroll'].forEach((n) => document.addEventListener(n, () => { lastTouch = Date.now(); }, { passive: true, capture: true }));
// 拡大・ダブルタップでの拡大を止める
['gesturestart', 'gesturechange', 'dblclick'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// しばらく触らなければ「きょう」に戻す（シートは1分、他の画面は2分）
setInterval(() => {
  const idle = Date.now() - lastTouch;
  if (!$('sheet').hidden && idle > 60e3) closeSheet();
  if (view !== 'today' && idle > 120e3) { view = 'today'; $('view').scrollTop = 0; render(true); }
}, 5e3);

async function load() {
  try {
    const r = await fetch('/api/data?key=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failed = false;
  } catch (e) { failed = true; }
  render();
}
load();
setInterval(load, 60e3);
setInterval(() => render(), 5e3);
window.addEventListener('resize', updateHint);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
// 毎日 午前3時30分に読み込み直す（更新したページを取り込むため）
setInterval(() => { const p = parts(now()); if (p.h === 3 && p.mi === 30) location.reload(); }, 60e3);
(async function keepAwake() {
  try { if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); } } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); }, { once: true });
})();
</script>
</body>
