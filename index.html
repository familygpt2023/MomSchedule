<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定表">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EFF3F4">
<title>きょうの予定</title>
<style>
:root {
  --paper: #EFF3F4;   /* 地の色：青みのある薄い灰 */
  --panel: #FFFFFF;
  --ink: #13242B;     /* 文字：黒に近い藍 */
  --sub: #4A5F67;
  --mute: #8C9EA6;    /* 過ぎた予定 */
  --line: #D2DCE0;
  --accent: #00677A;  /* 「いま」「次」だけに使う青緑 */
  --accent-ink: #FFFFFF;
  --accent-soft: #D5EAEF;
}
[data-theme="night"] {
  --paper: #0B1519;
  --panel: #122128;
  --ink: #E8F1F3;
  --sub: #A3B8BF;
  --mute: #5C7078;
  --line: #213640;
  --accent: #58C2D4;
  --accent-ink: #052329;
  --accent-soft: #123640;
}
* { box-sizing: border-box; }
html { font-size: min(1.5vw, 2vh); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; height: 100dvh; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  font-weight: 500; line-height: 1.25;
  -webkit-user-select: none; user-select: none;
}
.board {
  height: 100dvh; padding: 2rem 2.6rem 1.8rem;
  display: grid; gap: 1.4rem 2.4rem;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "main side";
}
.head { grid-area: head; display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; }
.date { display: flex; align-items: baseline; gap: 1.6rem; }
.md { font-size: 5.2rem; font-weight: 800; letter-spacing: .01em; }
.wd { font-size: 3.2rem; font-weight: 700; color: var(--sub); }
.wd.sun, .wd.sat { color: var(--accent); }
.clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock .ap { font-size: 2.1rem; color: var(--sub); margin-right: .6rem; }
.clock .hm { font-size: 5.2rem; font-weight: 800; }

.main { grid-area: main; display: flex; flex-direction: column; gap: 1.3rem; min-height: 0; }
.hero {
  background: var(--accent); color: var(--accent-ink);
  border-radius: 1.2rem; padding: 1.2rem 1.8rem 1.3rem;
  display: flex; flex-direction: column; gap: .5rem;
}
.hero.quiet { background: var(--panel); color: var(--ink); border: .15rem solid var(--line); }
.hero .lab { font-size: 1.7rem; font-weight: 700; opacity: .85; }
.hero .ti {
  font-size: 3.1rem; font-weight: 800; line-height: 1.15; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hero .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5rem; margin-top: .3rem; }
.hero .cnt { font-size: 2.8rem; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.hero .meta { font-size: 1.9rem; opacity: .92; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero.quiet .ti { font-size: 2.8rem; }

.today { min-height: 0; flex: 1; display: flex; flex-direction: column; }
h2 { margin: 0 0 .5rem; font-size: 1.7rem; font-weight: 700; color: var(--sub); }
ul { list-style: none; margin: 0; padding: 0; }
.today ul { flex: 1; min-height: 0; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 8.8rem minmax(0, 1fr) auto; align-items: center; gap: 1.2rem;
  padding: .65rem 1.1rem; border-top: .1rem solid var(--line);
}
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .t { font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .ap { font-size: 1.3rem; color: var(--sub); margin-right: .3rem; }
.row .hm { font-size: 2.4rem; font-weight: 800; }
.row .hm.all { font-size: 2.1rem; color: var(--sub); }
.row .ti { font-size: 2.2rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.row .lo { font-size: 1.6rem; font-weight: 500; color: var(--sub); margin-top: .15rem; }
.row .st { font-size: 1.5rem; font-weight: 700; color: var(--mute); white-space: nowrap; }
.row.past .ti, .row.past .hm, .row.past .lo, .row.past .ap { color: var(--mute); font-weight: 600; }
.row.cur, .row.next { border-top-color: transparent; background: var(--accent-soft); border-radius: .8rem; box-shadow: inset .5rem 0 0 var(--accent); }
.row.cur .st, .row.next .st { color: var(--accent); }
.more { padding: .4rem 1.1rem 0; min-height: 2.4rem; font-size: 1.6rem; color: var(--sub); border-top: .1rem solid var(--line); }
.empty { padding: 1rem 1.1rem; font-size: 2rem; color: var(--sub); border-top: .1rem solid var(--line); }

.side {
  grid-area: side; min-height: 0; background: var(--panel); border-radius: 1.2rem;
  padding: 1.3rem 1.6rem; display: flex; flex-direction: column; gap: 1.2rem; overflow: hidden;
}
.side section { flex: none; }
.side section + section { border-top: .1rem solid var(--line); padding-top: 1.1rem; }
.mini { display: grid; grid-template-columns: 7.4rem minmax(0, 1fr); gap: .9rem; align-items: baseline; padding: .35rem 0; }
.mini .t { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini .t .ap { font-size: 1.1rem; font-weight: 600; color: var(--sub); margin-right: .2rem; }
.mini .t.all { font-size: 1.6rem; color: var(--sub); }
.mini .ti { font-size: 2rem; font-weight: 700; line-height: 1.2; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.day { font-size: 1.6rem; font-weight: 700; color: var(--accent); margin-top: .5rem; }
.none { font-size: 1.8rem; color: var(--sub); padding: .2rem 0; }
.todo { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 1rem; align-items: center; padding: .4rem 0; }
.todo i { width: 1.7rem; height: 1.7rem; border: .2rem solid var(--accent); border-radius: 50%; }
.todo .ti { font-size: 2rem; font-weight: 700; line-height: 1.2; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.todo .due { font-size: 1.4rem; color: var(--sub); margin-left: .8rem; font-weight: 500; }

.net {
  position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
  background: #8A4B00; color: #fff; font-size: 1.8rem; font-weight: 700;
  padding: .7rem 1.6rem; border-radius: 99rem;
}
.net[hidden] { display: none; }
.stamp { position: fixed; right: 1.4rem; bottom: .6rem; font-size: 1.2rem; color: var(--mute); }

@media (max-aspect-ratio: 1/1) {
  html { font-size: min(2.3vw, 1.5vh); }
  .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "head" "main" "side"; padding: 1.6rem 2rem; gap: 1.2rem; }
  .side { max-height: 38dvh; }
  .md { font-size: 4.6rem; white-space: nowrap; }
  .wd { font-size: 2.6rem; white-space: nowrap; }
  .date { gap: 1rem; }
  .clock .hm { font-size: 4.6rem; }
  .clock .ap { font-size: 1.7rem; }
  .hero .ti { font-size: 3.1rem; }
  .hero .cnt { font-size: 2.8rem; }
}
</style>
</head>
<body>
<div class="board" id="board">
  <header class="head"><div class="date" id="date"></div><div class="clock" id="clock"></div></header>
  <main class="main"><div id="hero"></div><div class="today" id="today"></div></main>
  <aside class="side" id="side"></aside>
</div>
<div class="net" id="net" hidden></div>
<div class="stamp" id="stamp"></div>

<script>
const q = new URLSearchParams(location.search);
const KEY = q.get('key') || '';
const HOUR = 3600e3, DAY = 864e5, JST = 9 * HOUR;
const WD = ['日', '月', '火', '水', '木', '金', '土'];

// ?at=17:30 で時刻を仮に動かして見た目を確認できる（動作確認用）
let offset = 0;
if (q.get('at')) {
  const [h, m] = q.get('at').split(':').map(Number);
  const n = Date.now(), j = new Date(n + JST);
  j.setUTCHours(h, m || 0, 0, 0);
  offset = (j.getTime() - JST) - n;
}
const now = () => Date.now() + offset;
const parts = (ms) => { const j = new Date(ms + JST); return { y: j.getUTCFullYear(), mo: j.getUTCMonth() + 1, d: j.getUTCDate(), wd: j.getUTCDay(), h: j.getUTCHours(), mi: j.getUTCMinutes() }; };
const dayKey = (ms) => Math.floor((ms + JST) / DAY);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const tm = (ms) => { const p = parts(ms); return { ap: p.h < 12 ? '午前' : '午後', hm: `${p.h <= 12 ? p.h : p.h - 12}:${pad(p.mi)}` }; };
const tmHtml = (ms) => { const t = tm(ms); return `<span class="ap">${t.ap}</span><span class="hm">${t.hm}</span>`; };
const until = (ms) => {
  const m = Math.max(1, Math.ceil(ms / 60e3));
  if (m < 60) return `あと${m}分`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `あと${h}時間${r}分` : `あと${h}時間`;
};
const dayLabel = (ms) => { const p = parts(ms); return `${p.mo}月${p.d}日（${WD[p.wd]}）`; };

let data = null, lastOk = 0, failed = false;

function norm(e) {
  const allDay = !!e.allDay;
  const s = allDay ? Date.parse(e.start + 'T00:00:00+09:00') : Date.parse(e.start);
  let en = allDay ? Date.parse(e.end + 'T00:00:00+09:00') : Date.parse(e.end);
  if (!(en > s)) en = s + 1;
  return { ...e, s, e: en };
}
const onDay = (evs, k) => evs
  .filter((e) => dayKey(e.s) <= k && dayKey(e.e - 1) >= k)
  .sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s));

function render() {
  const n = now(), p = parts(n), today = dayKey(n);
  const theme = q.get('theme') || ((p.h >= 21 || p.h < 6) ? 'night' : 'day');
  document.documentElement.dataset.theme = theme;

  document.getElementById('date').innerHTML =
    `<span class="md">${p.mo}月${p.d}日</span><span class="wd ${p.wd === 0 ? 'sun' : p.wd === 6 ? 'sat' : ''}">${WD[p.wd]}曜日</span>`;
  document.getElementById('clock').innerHTML = tmHtml(n);

  const evs = (data?.events || []).map(norm);
  const todays = onDay(evs, today);
  const timed = todays.filter((e) => !e.allDay);
  const cur = timed.find((e) => e.s <= n && n < e.e);
  const next = timed.find((e) => e.s > n);
  const allDay = todays.find((e) => e.allDay);

  // 主役：いま／次の予定
  let hero;
  const rng = (e) => {
    const a = tm(e.s), b = tm(e.e);
    return `${a.ap} ${a.hm} 〜 ${a.ap === b.ap ? '' : b.ap + ' '}${b.hm}`;
  };
  const foot = (meta, cnt) => `<div class="foot"><div class="meta">${meta}</div><div class="cnt">${cnt}</div></div>`;
  if (cur) {
    hero = `<section class="hero"><div class="lab">いま</div><div class="ti">${esc(cur.title)}</div>${foot(rng(cur), `${tm(cur.e).ap}${tm(cur.e).hm}まで`)}</section>`;
  } else if (next) {
    hero = `<section class="hero"><div class="lab">次の予定</div><div class="ti">${esc(next.title)}</div>${foot(rng(next), until(next.s - n))}</section>`;
  } else if (allDay) {
    hero = `<section class="hero"><div class="lab">きょう</div><div class="ti">${esc(allDay.title)}</div>${foot('終日', '')}</section>`;
  } else {
    const tmr = onDay(evs, today + 1).find((e) => !e.allDay);
    const msg = timed.length ? 'きょうの予定は おわりました' : 'きょうは 予定がありません';
    hero = `<section class="hero quiet"><div class="ti">${msg}</div>${tmr ? foot(`あしたは ${tm(tmr.s).ap} ${tm(tmr.s).hm} から ${esc(tmr.title)}`, '') : ''}</section>`;
  }
  document.getElementById('hero').innerHTML = hero;

  // きょうの一覧（入りきらないときは、過ぎた予定から順に減らす）
  const rows = todays.map((e) => {
    const isPast = !e.allDay && e.e <= n, isCur = e === cur, isNext = e === next && !cur;
    const cls = isCur ? 'cur' : isNext ? 'next' : isPast ? 'past' : '';
    const tag = isCur ? 'いま' : isNext ? '次' : isPast ? 'おわり' : '';
    const t = e.allDay ? '<span class="hm all">終日</span>' : tmHtml(e.s);
    return `<li class="row ${cls}"><div class="t">${t}</div><div class="w"><div class="ti clamp2">${esc(e.title)}</div>${e.location ? `<div class="lo">${esc(e.location)}</div>` : ''}</div><div class="st">${tag}</div></li>`;
  }).join('');
  const todayEl = document.getElementById('today');
  todayEl.innerHTML = `<h2>きょうの予定</h2>` + (rows ? `<ul>${rows}</ul>` : `<div class="empty">予定はありません</div>`) + `<div class="more"></div>`;

  // 右：あした／この先／やること
  const mini = (e) => `<div class="mini"><div class="t ${e.allDay ? 'all' : ''}">${e.allDay ? '終日' : tmHtml(e.s)}</div><div class="ti">${esc(e.title)}</div></div>`;
  const tmrEvs = onDay(evs, today + 1);
  let side = `<section><h2>あした</h2>${tmrEvs.length ? tmrEvs.slice(0, 3).map(mini).join('') + (tmrEvs.length > 3 ? `<div class="none">ほか ${tmrEvs.length - 3}件</div>` : '') : '<div class="none">予定はありません</div>'}</section>`;

  let later = '', lines = 0;
  for (let k = today + 2; k <= today + 7 && lines < 5; k++) {
    const list = onDay(evs, k);
    if (!list.length) continue;
    later += `<div class="day">${dayLabel(k * DAY - JST)}</div>`;
    for (const e of list) { if (lines >= 5) break; later += mini(e); lines++; }
  }
  side += `<section><h2>この先</h2>${later || '<div class="none">1週間は予定がありません</div>'}</section>`;

  const tasks = (data?.tasks || []).slice(0, 5);
  if (tasks.length) {
    side += `<section><h2>やること</h2>${tasks.map((t) => {
      let due = '';
      if (t.due) {
        const k = dayKey(Date.parse(t.due + 'T00:00:00+09:00'));
        due = k < today ? 'すぎています' : k === today ? '' : `${dayLabel(k * DAY - JST).replace(/（.）/, '')}まで`;
      }
      return `<div class="todo"><i></i><div class="ti">${esc(t.title)}${due ? `<span class="due">${due}</span>` : ''}</div></div>`;
    }).join('')}</section>`;
  }
  const sideEl = document.getElementById('side');
  sideEl.innerHTML = side;
  // 入りきらないときは、この先 → やること → あした の順に減らす
  for (let guard = 0; sideEl.scrollHeight > sideEl.clientHeight + 1 && guard < 30; guard++) {
    const later = [...sideEl.querySelectorAll('section:nth-of-type(2) .mini')];
    const todos = [...sideEl.querySelectorAll('.todo')];
    const tmrs = [...sideEl.querySelectorAll('section:nth-of-type(1) .mini')];
    const v = later.length > 1 ? later.at(-1) : todos.length > 1 ? todos.at(-1) : tmrs.length > 1 ? tmrs.at(-1) : later.at(-1);
    if (!v) break;
    v.remove();
    sideEl.querySelectorAll('.day').forEach((d) => { if (!d.nextElementSibling?.classList.contains('mini')) d.remove(); });
  }
  sideEl.querySelectorAll('section').forEach((sec) => { if (!sec.querySelector('.mini, .todo, .none')) sec.remove(); });

  // きょうの一覧：入りきらないときは、過ぎた予定から順に減らす（右側を作ったあとで測る）
  const ul = todayEl.querySelector('ul');
  let removed = 0;
  while (ul && ul.scrollHeight > ul.clientHeight + 1 && ul.children.length > 1) {
    const kids = [...ul.children];
    const victim = kids.find((k) => k.classList.contains('past'))
      || [...kids].reverse().find((k) => !k.classList.contains('cur') && !k.classList.contains('next'))
      || kids[kids.length - 1];
    if (!victim.classList.contains('past')) removed++;   // 終わった予定は数えない
    victim.remove();
  }
  if (removed) todayEl.querySelector('.more').textContent = `ほか ${removed}件`;

  // つながり具合
  const netEl = document.getElementById('net');
  const old = lastOk && (Date.now() - lastOk > 5 * 60e3);
  if (!data) { netEl.hidden = false; netEl.textContent = failed ? 'よみこめません。しばらくお待ちください' : 'よみこみ中…'; }
  else if (failed || old || data.stale) { const s = parts(Date.parse(data.updated) || lastOk); netEl.hidden = false; netEl.textContent = `ネットにつながっていません（${tm(Date.parse(data.updated)).ap}${s.h <= 12 ? s.h : s.h - 12}:${pad(s.mi)} の情報です）`; }
  else netEl.hidden = true;
  const u = data && Date.parse(data.updated);
  document.getElementById('stamp').textContent = u ? `更新 ${tm(u).ap}${tm(u).hm}` : '';
}

async function load() {
  try {
    const r = await fetch('/api/data?key=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json(); lastOk = Date.now(); failed = false;
  } catch (e) { failed = true; }
  render();
}

load();
setInterval(load, 60e3);
setInterval(render, 5e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
// 毎日 午前3時30分に読み込み直す（更新したページを取り込むため）
setInterval(() => { const p = parts(now()); if (p.h === 3 && p.mi === 30) location.reload(); }, 60e3);
// 画面を消さない（対応していれば）
(async function keepAwake() {
  try { if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); } } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); }, { once: true });
})();
</script>
</body>
</html>
